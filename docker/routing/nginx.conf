# Caddy is the only caller of this private proxy. The shared rate limit protects
# this small VPS; application/worker routing uses the private OSRM service.
limit_req_zone $server_name zone=contrust_routing:1m rate=10r/s;
server {
    listen 8080;
    # A nonempty, fixed name makes the shared $server_name rate-limit key
    # independent of the request Host. Empty keys are not counted by Nginx.
    server_name contrust-routing;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    add_header Access-Control-Allow-Origin "https://contrust.website" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    # OSRM supplies permissive CORS headers; a duplicate Allow-Origin makes
    # browsers reject the response. This proxy owns the public CORS policy.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    location ~ ^/(route|nearest|table|match|trip)/v1/driving/ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET OPTIONS { deny all; }
        limit_req zone=contrust_routing burst=20 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_pass http://routing:5000;
    }
    location / { return 404; }
}

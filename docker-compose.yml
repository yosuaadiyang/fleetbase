services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    # Binary logging is on by default in MySQL 8 with a 30-day expiry. Nothing
    # here replicates from or reads the binlog, and the telematics ingest made it
    # grow past 300 GB locally, so it is switched off.
    command: ["mysqld", "--skip-log-bin"]
    # Loopback only. A bare "3306:3306" listens on every interface, and Docker's
    # published ports bypass host firewalls such as ufw, so on a server the database
    # was reachable from the internet. Host tools still connect on 127.0.0.1:3306.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      # SOCKETCLUSTER_OPTIONS can be set via docker-compose.override.yml to restrict the
      # origins allowed to connect. Each entry is "hostname:port" (not a URL), and the list
      # must be a JSON array: a plain string is matched by substring, so "e.com:*" would
      # also admit "console.example.com". Always include "null:*": the API publishes
      # events over a WebSocket that sends no Origin header, and without it every
      # real-time update is refused.
      #   SOCKETCLUSTER_OPTIONS: '{"origins":["app.example.com:*","null:*"]}'

  # The scheduler and queue run the same code as `application` and need the same
  # configuration and files: the same api/.env, and the same storage/app, so a file a
  # queued job writes (an export, an import, a generated document) is one the API can
  # serve. docker-compose.override.yml gives all three the same environment.
  scheduler:
    image: fleetbase/fleetbase-api:latest
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    # The image's own healthcheck probes FrankenPHP's admin port, which nothing listens
    # on here, so this container always read "unhealthy". Without a database the
    # scheduler registers no tasks at all and still exits 0 every minute, so check that.
    healthcheck:
      test: ["CMD", "php", "artisan", "db:monitor", "--databases=mysql"]
      interval: 60s
      timeout: 20s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    # queue:status only pings Redis; a worker that cannot reach the database fails
    # every job yet passed it, so the database is checked too.
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:status && php artisan db:monitor --databases=mysql"]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    restart: unless-stopped
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Fleetbase
      APP_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - application

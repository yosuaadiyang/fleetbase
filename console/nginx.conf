server {
    listen       4200;
    server_name  localhost;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }

    # Only content-addressed assets receive immutable caching. Keep runtime and
    # extension manifests fresh so deployment changes are discovered on reload.
    location ~* "^/(assets|engines-dist|favicon)/.*[-.][0-9a-f]{20,}\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /extensions.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 '{}';
    }
}

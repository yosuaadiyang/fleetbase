name: Contrust Release Gate
on:
  push:
    branches: [main, fix/contrust-deployment-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contrust-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Contrust API regression and isolated HTTP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record runner capacity and add temporary build swap
        shell: bash
        run: |
          set -euo pipefail
          free -m
          df -h /
          # Standard public runner only; no paid runner, artifact or remote storage.
          sudo fallocate -l 8G /mnt/contrust-build.swap
          sudo chmod 600 /mnt/contrust-build.swap
          sudo mkswap /mnt/contrust-build.swap
          sudo swapon /mnt/contrust-build.swap
          free -m
      - name: Build the patched release candidate (no optional secrets)
        run: bash scripts/release/build-ci-api.sh
      - name: Release unused build cache before integration infrastructure
        run: |
          docker builder prune --all --force
          free -m
          df -h /
      - name: Build pinned secured socket candidate
        run: docker build -f docker/socket/Dockerfile -t contrust-socket:release-qa .
      - name: Resolved socket mounts and actual bounded runtime startup
        run: python3 scripts/release/check-socket-runtime.py contrust-socket:release-qa
      - name: Offsite monitor alert deduplication without sending email
        run: python3 -m unittest discover -s scripts/monitor -p test_monitor.py
      - name: Auth, email, tracking, and routing regressions without network
        run: bash scripts/release/run-offline-regressions.sh contrust-api:release-qa
      - name: Fetch pinned QA infrastructure images
        run: |
          docker pull mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          docker tag mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b mysql:8.0-oracle
          docker pull redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          docker tag redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 redis:7-alpine
      - name: Prepare synthetic-only QA secrets
        run: python3 scripts/release/prepare-qa-env.py --output qa-release.env --api-image contrust-api:release-qa
      - name: Isolated migrations, fixtures and HTTP contract (required)
        run: bash scripts/release/run-http-contract.sh qa-release.env
      - name: Stop only this isolated QA stack
        if: always()
        run: |
          if [ -f qa-release.env ]; then
            docker compose --env-file qa-release.env -f docker/release-qa/compose.yml down
            rm -f qa-release.env
          fi
  frontend:
    name: Contrust frontend regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      API_HOST: https://api.contrust.website
      API_SECURE: true
      OSRM_HOST: https://api.contrust.website/routing
      SOURCE_CODE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Frozen dependencies and maintained vendor patches
        working-directory: console
        run: pnpm install --frozen-lockfile
      - name: Dependency backport integrity and bounded build inputs
        run: node scripts/release/check-dependency-security.cjs
      - name: Required full frontend regression suite
        working-directory: console
        shell: bash
        run: |
          set -euo pipefail
          API_HOST=http://127.0.0.1:18080 API_SECURE=false pnpm exec ember test | tee /tmp/contrust-frontend-tests.log
          python3 ../scripts/release/check-frontend-results.py /tmp/contrust-frontend-tests.log
      - name: Production build
        working-directory: console
        run: pnpm exec ember build --environment production
# No deployment, paid runners, external provider secrets, or artifact storage.

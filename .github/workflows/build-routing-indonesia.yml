name: Prepare Indonesia routing (manual trial)

on:
  push:
    branches: [fix/contrust-deployment-audit]
    paths: [.github/workflows/build-routing-indonesia.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indonesia-routing-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    steps:
      - name: Restore previously validated graph archive
        id: graph-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            indonesia-osrm-20261012.tar.gz
            indonesia-osrm-20261012.tar.gz.sha256
          key: indonesia-osrm-261012-mld-55dbfd47-v1
      - name: Verify restored archive
        if: ${{ steps.graph-cache.outputs.cache-hit == 'true' }}
        run: sha256sum --check indonesia-osrm-20261012.tar.gz.sha256
      - name: Prepare and validate graph
        if: ${{ steps.graph-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h .
          # Previous run exhausted the 14 GiB RAM / 16 GiB total limit.
          # Additional swap belongs only to this ephemeral preparation runner.
          available=$(df --output=avail -B1 . | tail -1)
          test "$available" -ge 53687091200
          sudo fallocate -l 24G /mnt/contrust-routing.swap
          sudo chmod 600 /mnt/contrust-routing.swap
          sudo mkswap /mnt/contrust-routing.swap
          sudo swapon /mnt/contrust-routing.swap
          free -h
          mkdir data
          curl -fL --retry 3 https://download.geofabrik.de/asia/indonesia-261012.osm.pbf -o data/indonesia.osm.pbf
          curl -fL --retry 3 https://download.geofabrik.de/asia/indonesia-261012.osm.pbf.md5 -o data/indonesia.osm.pbf.md5
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('data');h=hashlib.md5()
          with (p/'indonesia.osm.pbf').open('rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''):h.update(b)
          assert h.hexdigest()==(p/'indonesia.osm.pbf.md5').read_text().split()[0]
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium tags-filter data/indonesia.osm.pbf nw/highway w/route w/railway r/type=restriction r/type=route -o data/indonesia.routing.osm.pbf --output-header=osmosis_replication_timestamp!
          for stage in extract partition customize; do
            echo "Preparing stage: $stage"
            free -h
            df -h .
            args=("osrm-$stage" --threads 2 /data/indonesia.osrm)
            if [ "$stage" = extract ]; then
              args=(osrm-extract --threads 2 --profile /opt/car.lua /data/indonesia.routing.osm.pbf --output /data/indonesia.osrm)
            fi
            container="routing-prep-$stage"
            set +e
            docker run --name "$container" --memory=13g --memory-swap=37g --cpus=4 -v "$PWD/data:/data" "$OSRM_IMAGE" "${args[@]}"
            status=$?
            set -e
            docker inspect --format '{{json .State}}' "$container"
            docker rm "$container"
            test "$status" -eq 0
          done
          docker run --rm --memory=1536m -v "$PWD/data:/data:ro" "$OSRM_IMAGE" osrm-routed --algorithm mld --mmap --threads 2 --trial /data/indonesia.osrm
          docker run -d --name routing-validation --memory=1536m --cpus=1.5 -p 127.0.0.1:5000:5000 -v "$PWD/data:/data:ro" "$OSRM_IMAGE" osrm-routed --algorithm mld --mmap --threads 2 /data/indonesia.osrm
          trap 'docker rm -f routing-validation' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:5000/nearest/v1/driving/106.8272,-6.1754' >/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json,urllib.request,pathlib,time
          cases={
              'Jakarta':'106.8272,-6.1754;106.8456,-6.2088',
              'Medan':'98.6722,3.5952;98.6837,3.5894',
              'Surabaya':'112.7521,-7.2575;112.7378,-7.2458',
              'Bali':'115.2126,-8.6705;115.2235,-8.6557',
              'Pontianak':'109.3435,-0.0263;109.3545,-0.0315',
              'Makassar':'119.4327,-5.1477;119.4369,-5.1341',
              'Jayapura':'140.7181,-2.5337;140.6975,-2.5620',
          }
          results=[]
          for city,coordinates in cases.items():
              start=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:5000/route/v1/driving/'+coordinates+'?overview=false',timeout=10) as r:data=json.load(r)
              assert data['code']=='Ok' and data['routes'],(city,data)
              assert all(w['distance']<2000 for w in data['waypoints']),(city,'snap distance too large')
              results.append({'city':city,'elapsed_ms':round((time.monotonic()-start)*1000),'distance_m':data['routes'][0]['distance']})
          pathlib.Path('data/route-validation.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
          docker stats --no-stream routing-validation
          du -sh data
          printf 'Graph built and representative queries passed. Runtime capacity still needs verification on the VPS.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Package validated graph
        if: ${{ steps.graph-cache.outputs.cache-hit != 'true' }}
        run: |
          cat > data/ATTRIBUTION.md <<'EOF'
          Indonesia snapshot 2026-10-12, Geofabrik, includes East Timor.
          Data: © OpenStreetMap contributors, ODbL 1.0.
          https://www.openstreetmap.org/copyright
          https://download.geofabrik.de/asia/indonesia.html
          OSRM car profile, MLD; image digest 55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f.
          Preparation filter: nw/highway w/route w/railway r/type=restriction r/type=route (including referenced nodes/members).
          EOF
          tar --exclude='*.osm.pbf'  --exclude='*.md5' -czf indonesia-osrm-20261012.tar.gz -C data .
          sha256sum indonesia-osrm-20261012.tar.gz > indonesia-osrm-20261012.tar.gz.sha256
          test "$(stat -c %s indonesia-osrm-20261012.tar.gz)" -lt 9663676416
      - name: Check free cache headroom
        id: cache-quota
        if: ${{ steps.graph-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > cache-usage.json
          python3 - <<'PY'
          import json,pathlib,os
          used=json.loads(pathlib.Path('cache-usage.json').read_text())['active_caches_size_in_bytes']
          size=pathlib.Path('indonesia-osrm-20261012.tar.gz').stat().st_size
          allowed=used+size+256*1024**2 < 10*1024**3
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('can_save='+str(allowed).lower()+'\n')
          print({'free_quota_gib':10,'used_bytes':used,'archive_bytes':size,'save_in_free_quota':allowed})
          PY
      - name: Preserve validated graph within free cache quota
        if: ${{ steps.cache-quota.outputs.can_save == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            indonesia-osrm-20261012.tar.gz
            indonesia-osrm-20261012.tar.gz.sha256
          key: indonesia-osrm-261012-mld-55dbfd47-v1
      - name: Transfer validated graph directly to VPS
        env:
          ROUTING_TRANSFER_KEY: ${{ secrets.CONTRUST_ROUTING_TRANSFER_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROUTING_TRANSFER_KEY"
          sha256sum --check indonesia-osrm-20261012.tar.gz.sha256
          checksum=$(sha256sum indonesia-osrm-20261012.tar.gz | cut -d ' ' -f 1)
          size=$(stat -c %s indonesia-osrm-20261012.tar.gz)
          test "$size" -le 10737418240
          umask 077
          key="$RUNNER_TEMP/contrust-routing-transfer.key"
          hosts="$RUNNER_TEMP/contrust-routing-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$ROUTING_TRANSFER_KEY" > "$key"
          printf '%s\n' '[103.147.33.10]:20318 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFVqzMbeEQpcDD6EvJWNjW7c0lJ1TuBnZUgawtVyeBIx' > "$hosts"
          ssh -T -p 20318 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@103.147.33.10 "upload-routing $checksum $size" < indonesia-osrm-20261012.tar.gz
          printf 'Validated graph delivered to private VPS staging. Production activation requires separate route/capacity checks.\n' >> "$GITHUB_STEP_SUMMARY"

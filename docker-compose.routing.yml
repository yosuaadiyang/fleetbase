# Activate only after a complete MLD graph has passed route and memory checks.
# Add this file to COMPOSE_FILE alongside the existing production files.
services:
  routing:
    image: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    command: ["osrm-routed", "--algorithm", "mld", "--mmap=true", "--threads", "2", "--max-viaroute-size", "100", "--max-table-size", "100", "--max-matching-size", "100", "--max-trip-size", "100", "/data/indonesia.osrm"]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OSRM_DATA_DIR:-./docker/routing/data}:/data:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  routing-proxy:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./docker/routing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [routing]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  application:
    image: ${CONTRUST_ROUTING_API_IMAGE:-contrust-api:routing-audit-20261014}
    build:
      context: ./docker/routing
      dockerfile: Dockerfile.api
    environment:
      OSRM_HOST: http://routing:5000
      OSRM_TIMEOUT: "5"
      OSRM_DATA_VERSION: ${OSRM_DATA_VERSION:-261012-mld-55dbfd47}
  queue:
    image: ${CONTRUST_ROUTING_API_IMAGE:-contrust-api:routing-audit-20261014}
    stop_grace_period: 120s
    environment:
      OSRM_HOST: http://routing:5000
      OSRM_TIMEOUT: "5"
      OSRM_DATA_VERSION: ${OSRM_DATA_VERSION:-261012-mld-55dbfd47}
  scheduler:
    image: ${CONTRUST_ROUTING_API_IMAGE:-contrust-api:routing-audit-20261014}
    stop_grace_period: 120s
    environment:
      OSRM_HOST: http://routing:5000
      OSRM_TIMEOUT: "5"
      OSRM_DATA_VERSION: ${OSRM_DATA_VERSION:-261012-mld-55dbfd47}

  console:
    build:
      args:
        OSRM_HOST: ${PUBLIC_OSRM_HOST:-https://api.contrust.website/routing}
